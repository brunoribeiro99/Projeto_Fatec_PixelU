<!DOCTYPE html>

<html lang="pt-br">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

<link rel="stylesheet" href="style.css">

<title>PixelU</title>


</head>

<body>


<main class="container py-5">

    <!-- TÍTULO -->

    <div class="text-center mb-5">

        <h1>Bem-vindo ao PixelU! 🎮</h1>

        <p class="lead">
            Responda algumas perguntas, descubra seu perfil e crie um avatar
            que representa você no mundo de Sistemas para Internet!
        </p>

    </div>





        <!-- ================================= -->
        <!-- INFORMAÇÕES PESSOAIS -->
        <!-- ================================= -->

        <section id="pessoais" class="card mb-4">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    Informações Pessoais
                </h2>


                <!-- NOME -->

                <div class="row">

                    <div class="col-6 mb-4">

                        <label for="nome" class="form-label">
                            01. Qual é o seu nome ou apelido?
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome ou apelido">

                    </div>


                    <!-- IDADE -->

                    <div class="col-3 mb-4">

                        <label for="idade" class="form-label">
                            02. Quantos anos você tem?
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="idade"
                            name="idade"
                            placeholder="Digite sua idade"
                            min="1"
                            max="100">

                    </div>


                    <!-- GÊNERO -->

                    <div class="col-3 mb-3">

                        <label for="genero" class="form-label">
                            03. Qual seu gênero?
                        </label>

                        <select
                            class="form-select"
                            name="genero"
                            id="genero">

                            <option selected disabled>
                                Selecione uma opção
                            </option>

                            <option value="masculino">
                                Masculino
                            </option>

                            <option value="feminino">
                                Feminino
                            </option>

                            <option value="nao_binario">
                                Não-binário
                            </option>

                            <option value="genero_fluido">
                                Gênero fluido
                            </option>

                            <option value="agenero">
                                Agênero
                            </option>

                            <option value="outro">
                                Outro
                            </option>

                            <option value="nao_informar">
                                Prefiro não informar
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================================= -->
        <!-- PERSONALIDADE -->
        <!-- ================================= -->

        <section id="personalidade" class="card mb-4">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    Personalidade
                </h2>


                <!-- PERGUNTA 01 -->

                <div class="mb-4">

                    <label class="form-label">
                        01. Você é uma pessoa extrovertida ou introvertida?
                    </label>

                    <div class="row">

                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="personalidade"
                                    id="extrovertido"
                                    value="extrovertido">

                                <label
                                    class="form-check-label"
                                    for="extrovertido">

                                    Extrovertido

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="personalidade"
                                    id="introvertido"
                                    value="introvertido">

                                <label
                                    class="form-check-label"
                                    for="introvertido">

                                    Introvertido

                                </label>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERGUNTA 02 -->

                <div class="mb-4">

                    <label class="form-label">
                        02. Qual dessas opções mais combina com os seus gostos?
                    </label>

                    <div class="row">

                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="geek"
                                    value="geek">

                                <label
                                    class="form-check-label"
                                    for="geek">

                                    🤓 Cultura Geek

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="pop"
                                    value="pop">

                                <label
                                    class="form-check-label"
                                    for="pop">

                                    🎬 Cultura Pop

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="games"
                                    value="games">

                                <label
                                    class="form-check-label"
                                    for="games">

                                    🎮 Games

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="tecnologia"
                                    value="tecnologia">

                                <label
                                    class="form-check-label"
                                    for="tecnologia">

                                    💻 Tecnologia

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="design"
                                    value="design">

                                <label
                                    class="form-check-label"
                                    for="design">

                                    🎨 Design e Arte

                                </label>

                            </div>


                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="gosto"
                                    id="musica"
                                    value="musica">

                                <label
                                    class="form-check-label"
                                    for="musica">

                                    🎵 Música

                                </label>

                            </div>

                        </div>

                    </div>

                <!-- PERGUNTA 03 -->

                    <label class="form-label">
                        03. Você se considera uma pessoa criativa?

                    </label>

                    <div class="row">

                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criatividade"
                                    id="criatividadeSim"
                                    value="sim">

                                <label
                                    class="form-check-label"
                                    for="criatividadeSim">

                                    Sim

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criatividade"
                                    id="criatividadeNao"
                                    value="nao">

                                <label
                                    class="form-check-label"
                                    for="criatividadeNao">

                            </div>

                    </div>

                <!-- PERGUNTA 04 -->

                    <label class="form-label">

                                    class="form-check-label"
                                    for="curiosidadeSim">

                                    Sim

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="curiosidade"
                                    id="curiosidadeNao"
                                    value="nao">

                                <label
                                    class="form-check-label"
                                    for="curiosidadeNao">

                                    Não

                                </label>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERGUNTA 05 -->

                <div class="mb-4">

                    <label class="form-label">
                        05. Você já ficou curioso(a) sobre como a internet

<div class="row">

                                    class="form-check-input"
                                    type="radio"
                                    name="internet"

                        <div class="col-6 mb-3">

                                <label

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERGUNTA 07 -->

                <div class="mb-4">

                    <label class="form-label">
                        07. Quando você tem liberdade para criar algo,

                    </label>

                    <div class="row">

                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criacao"
                                    id="visual"
                                    value="visual">

                                <label
                                    class="form-check-label"
                                    for="visual">

                                    🎨 Criar algo bonito e visual

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criacao"

                                    class="form-check-label"

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criacao"

                                <label
                                    class="form-check-label"
                                    for="inovador">

                                </label>

                            </div>

                        </div>


                        <div class="col-6 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="criacao"
                                    id="util"
                                    value="util">

                                <label
                                    class="form-check-label"
                                    for="util">

                                    🛠️ Criar algo útil para outras pessoas

                                </label>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERGUNTA 08 -->

                <div class="mb-4">

                    <label class="form-label">
                        08. Como você prefere trabalhar?
                    </label>

                    <div class="row">

                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="equipe"
                                    id="equipe"
                                    value="equipe">

                                <label
                                    class="form-check-label"
                                    for="equipe">

                                    👥 Com outras pessoas

                                </label>

                            </div>

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="equipe"
                                    id="sozinho"
                                    value="sozinho">

                                <label
                                    class="form-check-label"
                                    for="sozinho">

                                    🧑‍💻 Sozinho

                                </label>

                            </div>

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="equipe"
                                    id="depende"
                                    value="depende">

                                <label
                                    class="form-check-label"
                                    for="depende">

                                    🔄 Depende da situação

                                </label>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- PERGUNTA 09 -->

                <div class="mb-4">

                    <label class="form-label">
                        09. Qual dessas áreas mais desperta sua curiosidade?
                    </label>

                    <div class="row">

                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="tecnologia"
                                    id="programacao"
                                    value="programacao">

                                <label
                                    class="form-check-label"
                                    for="programacao">

                                    💻 Programação

                                </label>

                            </div>

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="tecnologia"
                                    id="designTecnologia"
                                    value="design">

                                <label
                                    class="form-check-label"
                                    for="designTecnologia">

                                </label>

                            </div>

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="tecnologia"
                                    id="redes"
                                    value="redes">

                                <label
                                    class="form-check-label"
                                    for="redes">

                                    🌐 Redes e internet

                                </label>

                            </div>

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="tecnologia"
                                    id="dados"
                                    value="dados">

                                <label

                        </div>


                        <div class="col-4 mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="tecnologia"

                                    class="form-check-label"

                        <div class="col-4 mb-3">

                                    class="form-check-label"

                                    class="form-check-input"
                                    type="radio"

                                    value="site">

                                    class="form-check-label"
                                    for="site">

<div class="row">

<div class="form-check">

    </div>
    <div class="col-6 mb-3">

                            class="form-check-input"
                            type="radio"
